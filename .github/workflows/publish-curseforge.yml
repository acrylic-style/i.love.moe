name: Publish Mod to CurseForge

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: Release notes shown on CurseForge
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Publish all supported versions
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: "1624436"
          CHANGELOG: ${{ inputs.changelog || github.event.head_commit.message || github.ref_name }}
        run: ./gradlew curseforge --no-daemon
